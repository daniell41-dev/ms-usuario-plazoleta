spring.application.name=ms-usuario

# Desactiva la autoconfiguración de spring-boot-docker-compose para que Spring
# use EXACTAMENTE las propiedades que definimos abajo y no las sobreescriba.
spring.docker.compose.enabled=false

# ─── Base de datos ────────────────────────────────────────────────────────────
# URL de conexión: jdbc (protocolo) : postgresql (BD) : //host:puerto/nombre_bd
spring.datasource.url=jdbc:postgresql://localhost:5432/ms_usuario_db
spring.datasource.username=usuario
spring.datasource.password=password
# El driver que JPA debe usar para conectarse a PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# validate  → solo verifica que el esquema coincida con las entidades (producción)
# update    → modifica el esquema automáticamente si cambian las entidades (desarrollo)
# create    → borra y recrea todo al iniciar (útil para pruebas rápidas)
# none      → no hace nada, tú gestionas el esquema manualmente
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola el SQL que genera Hibernate (muy útil para aprender y depurar)
spring.jpa.show-sql=true
# Formatea el SQL para que sea legible en la consola
spring.jpa.properties.hibernate.format_sql=true
# Dialecto: le dice a Hibernate que estamos usando PostgreSQL específicamente
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ─── JWT ──────────────────────────────────────────────────────────────────────
# Clave secreta con la que se firma el token. Debe ser larga y difícil de adivinar.
# En producción esto iría en una variable de entorno, nunca en el código.
jwt.secret=clave-secreta-muy-larga-para-firmar-el-token-jwt-plazoleta-2024
# Tiempo de vida del token en milisegundos. 86400000 = 24 horas.
jwt.expiration=86400000
